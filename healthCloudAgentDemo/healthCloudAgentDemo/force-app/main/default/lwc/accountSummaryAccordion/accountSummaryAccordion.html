<template>
    <lightning-card title="Account Summaries" icon-name="custom:custom63">
        <!-- Actions slot for button when summaries exist -->
        <template if:true={hasSummaries}>
            <div slot="actions" class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                <lightning-button
                    label="Generate Summary"
                    onclick={handleGenerateSummary}
                    disabled={isFlowRunning}
                    variant="neutral"
                    icon-name="utility:refresh"
                    class="slds-m-right_x-small">
                </lightning-button>
                <template if:true={isFlowRunning}>
                    <lightning-spinner alternative-text="Generating summary" size="small"></lightning-spinner>
                </template>
            </div>
        </template>

        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-text-align_center">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-p-around_medium">
                <div class="slds-text-color_error">
                    <lightning-icon icon-name="utility:error" size="small" variant="error"></lightning-icon>
                    Error loading summaries. Please refresh the page.
                </div>
            </div>
        </template>

        <template if:true={hasSummaries}>
            <div class="accordion-container">
                <!-- Active Summary Display -->
                <template if:true={activeSummary}>
                    <div class="active-summary slds-p-around_medium">
                        <div class="summary-header slds-m-bottom_small">
                            <lightning-icon icon-name="utility:notebook" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span class="summary-label">{activeSummary.label}</span>
                        </div>
                        <div class="summary-content">
                            <div class="formatted-summary" lwc:dom="manual"></div>
                        </div>
                    </div>
                </template>

                <!-- Accordion Tabs (only show if multiple summaries exist) -->
                <template if:true={hasMultipleSummaries}>
                    <div class="accordion-tabs slds-border_top">
                        <div class="tabs-header slds-p-horizontal_medium slds-p-vertical_x-small slds-text-heading_small">
                            Other Summaries (Recent 3)
                        </div>
                        <template for:each={recentOtherSummaries} for:item="summary">
                            <div
                                key={summary.Id}
                                class="tab-item slds-p-around_small slds-border_top"
                                data-id={summary.Id}
                                onclick={handleSectionClick}
                            >
                                <div class="tab-content">
                                    <lightning-icon icon-name="utility:chevronright" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                    <span class="tab-label">{summary.label}</span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <template if:false={hasSummaries}>
            <template if:false={isLoading}>
                <div class="slds-p-around_large slds-text-align_center empty-state">
                    <lightning-icon icon-name="custom:custom63" size="large" class="slds-m-bottom_medium empty-state-icon"></lightning-icon>
                    <h3 class="slds-text-heading_medium slds-m-bottom_small">No Account Summaries Yet</h3>
                    <p class="slds-text-color_weak slds-m-bottom_medium">
                        Generate an AI-powered summary to get insights about this account.
                    </p>
                    <lightning-button
                        label="Generate Account Summary"
                        onclick={handleGenerateSummary}
                        disabled={isFlowRunning}
                        variant="brand"
                        icon-name="utility:einstein"
                        class="slds-m-top_small">
                    </lightning-button>
                    <template if:true={isFlowRunning}>
                        <div class="slds-m-top_medium">
                            <lightning-spinner alternative-text="Generating summary" size="small"></lightning-spinner>
                            <p class="slds-text-color_weak slds-m-top_small">Generating your summary...</p>
                        </div>
                    </template>
                </div>
            </template>
        </template>

        <!-- Flow component - only rendered when needed -->
        <template if:true={showFlowComponent}>
            <lightning-flow
                onstatuschange={handleFlowStatusChange}>
            </lightning-flow>
        </template>
    </lightning-card>
</template>
